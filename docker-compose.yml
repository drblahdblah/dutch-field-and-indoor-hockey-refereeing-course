services:
  api:
    image: python:3.12-slim
    working_dir: /app
    volumes:
      - ./backend:/app
      - course-data:/app/data
    command: >
      sh -c "pip install --no-cache-dir -r requirements.txt
      && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    ports:
      - "8000:8000"
    environment:
      COURSE_DATABASE_URL: sqlite:////app/data/course.db
      COURSE_CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173

  web:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - ./frontend:/app
      - web-node-modules:/app/node_modules
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports:
      - "5173:5173"
    environment:
      VITE_API_BASE: http://localhost:8000
    depends_on:
      - api

volumes:
  course-data:
  web-node-modules:
