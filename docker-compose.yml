# Local development stack (hot reload).
# Prod-ish single-host demo: docker compose -f docker-compose.yml -f docker-compose.prod.yml up --build
# Copy backend/.env.example → backend/.env (and frontend/.env.example) before changing secrets/CORS.

services:
  api:
    image: python:3.12-slim
    working_dir: /app
    volumes:
      - ./backend:/app
      - course-data:/app/data
    command: >
      sh -c "pip install --no-cache-dir -r requirements.txt
      && uvicorn app.main:app --host 0.0.0.0 --port 8010 --reload"
    ports:
      - "8010:8010"
    environment:
      COURSE_DATABASE_URL: sqlite:////app/data/course.db
      COURSE_CORS_ORIGINS: http://localhost:5174,http://127.0.0.1:5174
      COURSE_ENVIRONMENT: development
      COURSE_TRUST_PROXY: "false"
      # Keep expose_access_token default (on in development) for TestClient / SPA bearer fallback.
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8010/api/health')",
        ]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 90s

  web:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - ./frontend:/app
      - web-node-modules:/app/node_modules
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5174"
    ports:
      - "5174:5174"
    environment:
      # Browser → host-mapped API. Do not use the compose service hostname here
      # (that only resolves inside the container network, not in the user's browser).
      VITE_API_BASE: http://localhost:8010
    depends_on:
      api:
        condition: service_healthy

volumes:
  course-data:
  web-node-modules:
